d1a:'<b>One trial only</b>: the 3D view uses a separate fixed-seed random draw, so when you move a slider the UE and the random numbers stay the same and only the effect of the parameter changes. Press “Resample” for a new draw; tick “Fix UE position” to place the UE yourself.',
d1b:'<b>Outdoor</b>: a PolyU-style campus street (red-brick and beige facades, window grids, street trees; schematic). The four buildings near the central reference point are drawn as solid grey boxes whose height follows the building-height slider H; satellites are blue (LOS), pink dashed (reflected, NLOS) or grey (blocked, lost).',
d1c:'<b>Indoor</b>: room CD302 with 60 tablet chairs, a blackboard at the front (reading “AAE4203 Group12 Present: 5G/6G vs GNSS Positioning”) with whiteboards on both sides, ceiling lights and 4 gNBs. Wall and ceiling opacity follow the wall attenuation L.',
d1d:'<b>Range rings</b>: the distance each gNB measures is drawn as a ring on the floor, with width ±3σ (the larger the bandwidth and the smaller the sync error, the thinner it gets; a minimum width is used when it would be too thin). A ring that does not enclose the UE means that gNB is NLOS. The small dot on a ring is the single-station position combined from range + angle.',
d1e:'<b>Estimated positions</b>: the blue, orange and green diamonds are the GNSS, Cellular and Hybrid results; the line to the true UE is the error.',
d2h:'How the simulation works',
d2a:'<b>Scene</b>: 2D plane. Outdoor is a north–south street (20 m wide, building height H adjustable on both sides) with 4 gNBs forming a 300 m square; the UE is placed at random on the street each time (x ±8 m, y ±80 m). Indoor is PolyU room CD302 with 4 gNBs at the ceiling corners and the UE placed at random inside. Bandwidth defaults to 50 MHz, close to the real range used by Hong Kong operators at 3.5 GHz.',
d2b:'<b>GNSS model</b>: 10 satellites are shown as 3D satellite models (gold body, two-segment solar arrays on each wing, an L-band antenna array facing the UE; the antenna ring colour shows LOS / reflected / blocked), and signal lines (solid = LOS, dashed = reflected, faint thin = blocked) show the pseudorange measurement direction; azimuth and elevation are random.\n<pre>ρᵢ = −uᵢ·p + c·δt + noise      σᵢ = √(1² + (2/sin elᵢ)²)\nOutdoor: satellites below elevation atan(H / ((W/2)/|sin az|)) are blocked; half become reflections (NLOS, bias ~ Exp 30 m) and half disappear\nIndoor : C/N0 = 45 − L − …; satellites below 25 dB-Hz disappear</pre>The height is known, so 3 satellites are enough to solve [x, y, clock].',
d2c:'<b>Cellular model</b>: each gNB provides one range and one angle.\n<pre>σ_range = √( (0.07·c/B)² + (c·σ_sync)² )     σ_angle = 1.5°\nLOS probability: 3GPP TR 38.901 formula (approximate)\nNLOS: range gets an Exp bias (outdoor 20 m, indoor 3 m), angle error 15°</pre>',
d2d:'<b>Estimator</b>: Gauss-Newton WLS with weights 1/σ²; the estimator does not know which measurements are NLOS, so NLOS causes bias.\n<pre>Δx = (HᵀWH)⁻¹ HᵀW (z − h(x))</pre>',
d2e:'<b>Hybrid</b>: the GNSS and Cellular measurements are stacked into the same H with shared position unknowns; information adds, so HᵀWH = H_Gᵀ W_G H_G + H_Cᵀ W_C H_C. With robust ticked, measurements whose residual exceeds 2.5σ are down-weighted.',
d2f:'<b>Monte Carlo</b>: the same random measurements are solved once by each of the three methods (paired comparison), repeated N times, and availability, RMSE, median and 95% are computed. The sweep chart at the lower right repeats this process over a series of shadowing levels (H or L) and marks the current position with a dashed line.',
d3h:'Assumptions and limitations',
d3a:'This is a statistical error model, not ray tracing or a full PHY; every value (0.07·c/B, NLOS bias, C/N0 threshold, etc.) is an assumption, so state them in your report and run a sensitivity analysis.',
d3b:'<b>CD302 dimensions are assumed</b>: the <a href="https://www.polyu.edu.hk/wgils/generalteachingrooms.php?room=CD302" target="_blank" rel="noopener">PolyU teaching room data</a> only lists CD302 as seating 60 with movable tablet chairs and gives no area or dimensions, so 12 m × 9 m × 3.2 m (about 1.8 m² per seat) is assumed here. To use measured dimensions, edit the <code>ROOM</code> constant at the top of the script; the 3D view and the simulation update together.',
d3c:'The outdoor 3D scene reads the Topoexport GeoJSON directly: terrain interpolated from LiDAR contours, buildings, trees, roads, railways, green areas and water. The model is for visualisation only and does not change the positioning error model; the simulated gNB / UE coordinates still follow the original scene coordinates.',
d3d:'Single-point positioning with no EKF or IMU; real phones also use A-GNSS, Wi-Fi and barometers.',
d3e:'Cellular uses range (similar to multi-RTT, without UE clock) plus AoA; errors are independent.'

d1h:'如何閱讀 3D 場景',
d1a:'<b>只有一次試驗</b>：3D 視圖使用另一組固定種子的隨機數，所以拖動滑桿時 UE 與隨機數保持不變，只有參數的影響會改變。按「重新取樣」可得到新的一組；勾選「固定 UE 位置」可自行放置 UE。',
d1b:'<b>室外</b>：理大風格的校園街道（紅磚與米色外牆、窗格、行道樹；示意用）。中央參考點附近的四幢建築以實心灰色方塊表示，高度隨建築物高度滑桿 H 變化；衛星為藍色（LOS）、粉紅虛線（反射，NLOS）或灰色（被擋，丟失）。',
d1c:'<b>室內</b>：CD302 課室，有 60 張平板椅、前方的黑板（寫着「AAE4203 Group12 Present: 5G/6G vs GNSS Positioning」）、兩側白板、天花燈與 4 個 gNB。牆壁與天花的不透明度隨牆體衰減 L 變化。',
d1d:'<b>距離環</b>：每個 gNB 量到的距離在地面畫成一個圓環，寬度為 ±3σ（頻寬越大、同步誤差越小，圓環越細；太細時使用最小寬度）。圓環沒有圈住 UE，代表該 gNB 為 NLOS。圓環上的小點是由距離 + 角度合成的單站位置。',
d1e:'<b>估計位置</b>：藍、橙、綠色菱形分別是 GNSS、蜂窩與混合定位的結果；連到真實 UE 的線就是誤差。',
d2h:'模擬如何運作',
d2a:'<b>場景</b>：二維平面。室外是南北走向的街道（闊 20 m，兩側建築物高度 H 可調），4 個 gNB 組成 300 m 的正方形；UE 每次隨機放在街道上（x ±8 m，y ±80 m）。室內是理大 CD302 課室，4 個 gNB 在天花板四角，UE 隨機放在室內。頻寬預設為 50 MHz，接近香港營辦商在 3.5 GHz 的實際範圍。',
d2b:'<b>GNSS 模型</b>：10 顆衛星以 3D 衛星模型顯示（金色機身、每側兩節太陽能板、朝向 UE 的 L 波段天線陣列；天線環的顏色表示 LOS / 反射 / 被擋），訊號線（實線 = LOS、虛線 = 反射、淡細線 = 被擋）顯示偽距量測方向；方位角與仰角為隨機。\n<pre>ρᵢ = −uᵢ·p + c·δt + noise      σᵢ = √(1² + (2/sin elᵢ)²)\n室外：仰角低於 atan(H / ((W/2)/|sin az|)) 的衛星被擋；一半變成反射 (NLOS，偏差 ~ Exp 30 m)，另一半消失\n室內：C/N0 = 45 − L − …；低於 25 dB-Hz 的衛星消失</pre>高度已知，所以 3 顆衛星就足以解出 [x, y, 時鐘]。',
d2c:'<b>蜂窩模型</b>：每個 gNB 提供一個距離和一個角度。\n<pre>σ_range = √( (0.07·c/B)² + (c·σ_sync)² )     σ_angle = 1.5°\nLOS 機率：3GPP TR 38.901 公式（近似）\nNLOS：距離加上 Exp 偏差（室外 20 m、室內 3 m），角度誤差 15°</pre>',
d2d:'<b>估計器</b>：權重為 1/σ² 的 Gauss-Newton WLS；估計器不知道哪些量測是 NLOS，所以 NLOS 會造成偏差。\n<pre>Δx = (HᵀWH)⁻¹ HᵀW (z − h(x))</pre>',
d2e:'<b>混合定位</b>：GNSS 與蜂窩量測疊加到同一個 H，共用位置未知數；資訊相加，所以 HᵀWH = H_Gᵀ W_G H_G + H_Cᵀ W_C H_C。勾選穩健後，殘差超過 2.5σ 的量測會被降權。',
d2f:'<b>蒙地卡羅</b>：同一組隨機量測由三種方法各解一次（配對比較），重複 N 次，再計算可用率、RMSE、中位數與 95%。右下角的掃描圖在一系列遮蔽程度（H 或 L）下重複這個過程，並以虛線標出目前位置。',
d3h:'假設與限制',
d3a:'這是統計誤差模型，不是射線追蹤或完整的 PHY；每個數值（0.07·c/B、NLOS 偏差、C/N0 門檻等）都是假設，請在報告中註明並做敏感度分析。',
d3b:'<b>CD302 的尺寸是假設的</b>：<a href="https://www.polyu.edu.hk/wgils/generalteachingrooms.php?room=CD302" target="_blank" rel="noopener">理大教學室資料</a>只列出 CD302 有 60 個座位、配活動平板椅，沒有面積或尺寸，所以這裏假設為 12 m × 9 m × 3.2 m（每個座位約 1.8 m²）。如要使用實測尺寸，請修改腳本頂部的 <code>ROOM</code> 常數；3D 視圖與模擬會一起更新。',
d3c:'室外 3D 場景直接讀取 Topoexport GeoJSON：由 LiDAR 等高線內插的地形、建築物、樹木、道路、鐵路、綠地與水體。此模型只用於視覺化，不會改變定位誤差模型；模擬的 gNB / UE 座標仍沿用原本的場景座標。',
d3d:'單點定位，沒有 EKF 或 IMU；真實手機還會使用 A-GNSS、Wi-Fi 與氣壓計。',

d2b:'<b>GNSS 模型</b>：10 颗卫星以 3D 卫星模型显示（金色机身、每侧两节太阳能板、朝向 UE 的 L 波段天线阵列；天线环的颜色表示 LOS / 反射 / 被挡），信号线（实线 = LOS、虚线 = 反射、淡细线 = 被挡）显示伪距测量方向；方位角与仰角为随机。\n<pre>ρᵢ = −uᵢ·p + c·δt + noise      σᵢ = √(1² + (2/sin elᵢ)²)\n室外：仰角低于 atan(H / ((W/2)/|sin az|)) 的卫星被挡；一半变成反射 (NLOS，偏差 ~ Exp 30 m)，另一半消失\n室内：C/N0 = 45 − L − …；低于 25 dB-Hz 的卫星消失</pre>高度已知，所以 3 颗卫星就足以解出 [x, y, 时钟]。',
d2c:'<b>蜂窝模型</b>：每个 gNB 提供一个距离和一个角度。\n<pre>σ_range = √( (0.07·c/B)² + (c·σ_sync)² )     σ_angle = 1.5°\nLOS 概率：3GPP TR 38.901 公式（近似）\nNLOS：距离加上 Exp 偏差（室外 20 m、室内 3 m），角度误差 15°</pre>',
d2d:'<b>估计器</b>：权重为 1/σ² 的 Gauss-Newton WLS；估计器不知道哪些测量是 NLOS，所以 NLOS 会造成偏差。\n<pre>Δx = (HᵀWH)⁻¹ HᵀW (z − h(x))</pre>',
d2e:'<b>混合定位</b>：GNSS 与蜂窝测量叠加到同一个 H，共用位置未知数；信息相加，所以 HᵀWH = H_Gᵀ W_G H_G + H_Cᵀ W_C H_C。勾选稳健后，残差超过 2.5σ 的测量会被降权。',
d2f:'<b>蒙特卡洛</b>：同一组随机测量由三种方法各解一次（配对比较），重复 N 次，再计算可用率、RMSE、中位数与 95%。右下角的扫描图在一系列遮蔽程度（H 或 L）下重复这个过程，并以虚线标出目前位置。',

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const host=$('v3');
const fail=k=>{const f=document.createElement('div');f.className='fb';f.setAttribute('data-i18n',k);f.textContent=tx(k);host.appendChild(f);window.upd3=function(){}};

host.insertBefore(renderer.domElement,host.firstChild);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.3,6000);
scene.add(new THREE.AmbientLight(0xffffff,.8));
const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(150,260,100);scene.add(sun);
const stat=new THREE.Group(),dyn=new THREE.Group();scene.add(stat,dyn);
const V={th:.75,ph:1,r:500,t:new THREE.Vector3()};
const VW={out:{th:.75,ph:1,r:520,t:[0,10,0],min:40,max:1500},in:{th:.7,ph:1.0,r:27,t:[0,3,0],min:4,max:90}};
/* Drawing scale for the two scenes (in m): outdoor is ~300 m scale, indoor is classroom scale */
const QO={hh:5,rs:1.8,rc:.4,r1:3,r2:3.6,est:2.7,pt:1.6,sat:9,beam:1.3,satR:240,lab:10,labU:9,lg:11,dash:[8,5],minw:.6,seg:180,gh:17};
const QI={hh:1.2,rs:.2,rc:.05,r1:.32,r2:.4,est:.3,pt:.16,sat:.7,beam:.03,satR:13,lab:.7,labU:.7,lg:.6,dash:[.5,.3],minw:.05,seg:120,gh:ROOM.h-.15};
let Q=QO;
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
let raf=0,auto=false,built='',dn=1,blds=[],wm=null,gS,gC,gG,gE,curP=[0,0],staticRev=0;
const TOPO_MODEL_URL='./models/topoexport_3D_modeling.3dm';
const cssc=n=>new THREE.Color(col(n));

/* ---------- render loop / camera ---------- */
function applyCam(){const sp=Math.sin(V.ph);cam.position.set(V.t.x+V.r*sp*Math.sin(V.th),V.t.y+V.r*Math.cos(V.ph),V.t.z+V.r*sp*Math.cos(V.th));cam.lookAt(V.t)}
function frame(){raf=0;if(auto)V.th+=.004;applyCam();renderer.render(scene,cam);if(auto)req()}
function req(){if(!raf)raf=requestAnimationFrame(frame)}
function fit(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();req()}
function resetView(){const d=VW[sc];V.th=d.th;V.ph=d.ph;V.r=d.r;V.t.set(d.t[0],d.t[1],d.t[2]);req()}
function zoom(f){const d=VW[sc];V.r=cl(V.r*f,d.min,d.max)}
function pan(dx,dy){cam.updateMatrixWorld();const r=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1),k=V.r*Math.tan(22.5*Math.PI/180)*2/host.clientHeight;V.t.addScaledVector(r,-dx*k).addScaledVector(u,dy*k);V.t.y=cl(V.t.y,0,150)}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(host);else addEventListener('resize',fit);

/* ---------- pointer / wheel / keyboard ---------- */
const ptr=new Map();
host.addEventListener('pointerdown',e=>{try{host.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button==2||e.shiftKey||e.ctrlKey});host.focus({preventScroll:true})});
host.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
if(ptr.size>=2){const a=[...ptr.values()],o=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);p.x=e.clientX;p.y=e.clientY;const n=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(o>0&&n>0)zoom(o/n)}
else if(p.pan){pan(dx,dy);p.x=e.clientX;p.y=e.clientY}
else{V.th-=dx*.006;V.ph=cl(V.ph-dy*.006,.05,1.5);p.x=e.clientX;p.y=e.clientY}
req()});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>host.addEventListener(n,e=>ptr.delete(e.pointerId)));
host.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*.0012));req()},{passive:false});
host.addEventListener('contextmenu',e=>e.preventDefault());
host.addEventListener('keydown',e=>{const k=e.key;let h=true;
if(k=='ArrowLeft')V.th-=.1;else if(k=='ArrowRight')V.th+=.1;else if(k=='ArrowUp')V.ph=cl(V.ph-.08,.05,1.5);else if(k=='ArrowDown')V.ph=cl(V.ph+.08,.05,1.5);
else if(k=='+'||k=='=')zoom(.9);else if(k=='-'||k=='_')zoom(1.1);else if(k=='Home')resetView();else h=false;
if(h){e.preventDefault();req()}});

/* ---------- helpers ---------- */
function clr(g){while(g.children.length){const o=g.children[g.children.length-1];g.remove(o);o.traverse(m=>{if(m.geometry)m.geometry.dispose();if(m.material)[].concat(m.material).forEach(x=>{if(x.map)x.map.dispose();x.dispose()})})}}
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const bas=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}));
const V3=(x,y,h)=>new THREE.Vector3(x,h,-y);
function lab(text,sz){const cv=document.createElement('canvas'),g=cv.getContext('2d'),f='bold 36px '+fnt();g.font=f;const w=Math.ceil(g.measureText(text).width)+28;cv.width=w;cv.height=60;g.font=f;g.fillStyle='rgba(14,21,27,.78)';g.fillRect(0,0,w,60);g.fillStyle='#fff';g.textBaseline='middle';g.fillText(text,14,31);
const tx=new THREE.CanvasTexture(cv),s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,transparent:true}));s.scale.set(sz*w/60,sz,1);s.renderOrder=10;return s}
function line(a,b,c,op,dash){const m=dash?new THREE.LineDashedMaterial({color:c,dashSize:Q.dash[0],gapSize:Q.dash[1],transparent:true,opacity:op}):new THREE.LineBasicMaterial({color:c,transparent:true,opacity:op});
const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),m);if(dash)l.computeLineDistances();return l}
/* one floor-and-bay tile of curtain-wall windows; the colour comes from the material tint */
function facade(){const cv=document.createElement('canvas');cv.width=cv.height=64;const g=cv.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,64,64);g.fillStyle='#46607a';g.fillRect(7,8,50,30);g.fillStyle='rgba(255,255,255,.3)';g.fillRect(7,8,50,7);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,56,64,8);
const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

/* Solar-cell texture (blue cells with silver grid lines), drawn once and wrapped per satellite. */
let panelCv=null;
function panelTex(){
  if(!panelCv){panelCv=document.createElement('canvas');panelCv.width=128;panelCv.height=64;const g=panelCv.getContext('2d');
    g.fillStyle='#1b4a8a';g.fillRect(0,0,128,64);g.strokeStyle='#9cbfe8';g.lineWidth=2;
    for(let x=0;x<=128;x+=16){g.beginPath();g.moveTo(x,0);g.lineTo(x,64);g.stroke()}
    for(let y=0;y<=64;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(128,y);g.stroke()}
    g.fillStyle='rgba(255,255,255,.14)';g.fillRect(0,0,128,10)}
  const t=new THREE.CanvasTexture(panelCv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

/* 3D GNSS satellite (GPS-style). Local +Z is the nadir axis (the side that faces the UE; the caller
   rotates +Z toward the UE). Parts: gold-foil bus, two 2-segment solar arrays on yokes, an L-band
   helix antenna array on the nadir face with a ring in the signal-state colour, and a TT&C antenna.
   state: 0 = LOS, 1 = NLOS / biased, 2 = blocked (drawn semi-transparent). */
function satelliteModel(size,stateColor,state){
  const g=new THREE.Group(),s=size,ghost=state===2;
  const mk=m=>{if(ghost){m.transparent=true;m.opacity=.4}return m};
  const silver=mk(lam(0xdfe3e8)),gold=mk(lam(0xd4a63f,{emissive:0x2a1d05})),dark=mk(lam(0x4b5560)),
        panel=mk(lam(0xffffff,{map:panelTex(),emissive:0x0a1f3a})),sig=mk(bas(stateColor));
  const add=(geo,mat,x,y,z,rx)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(rx)m.rotation.x=rx;g.add(m);return m};
  /* bus: gold thermal blanket with silver bands */
  add(new THREE.BoxGeometry(.78*s,.7*s,1.1*s),gold,0,0,0);
  add(new THREE.BoxGeometry(.84*s,.76*s,.12*s),silver,0,0,-.3*s);
  add(new THREE.BoxGeometry(.84*s,.76*s,.12*s),silver,0,0,.3*s);
  /* nadir L-band array: plate, centre + 6 ring helices, state-coloured rim */
  add(new THREE.CylinderGeometry(.34*s,.34*s,.06*s,20),dark,0,0,.58*s,Math.PI/2);
  const helix=new THREE.CylinderGeometry(.04*s,.065*s,.22*s,8);
  add(helix,silver,0,0,.7*s,Math.PI/2);
  for(let i=0;i<6;i++){const a=i*Math.PI/3;add(helix,silver,Math.cos(a)*.22*s,Math.sin(a)*.22*s,.7*s,Math.PI/2)}
  add(new THREE.TorusGeometry(.38*s,.028*s,6,28),sig,0,0,.62*s);
  /* solar arrays: yoke arm + two cell segments per side (cells face +Y, towards the sun) */
  [-1,1].forEach(side=>{
    add(new THREE.BoxGeometry(.42*s,.07*s,.07*s),dark,side*.58*s,0,0);
    [1.27,2.31].forEach(cx=>{const seg=add(new THREE.BoxGeometry(1.0*s,.05*s,.9*s),panel,side*cx*s,0,0);seg.material.map.repeat.set(1,1)});
    add(new THREE.BoxGeometry(2.1*s,.06*s,.05*s),dark,side*1.8*s,.03*s,-.45*s);
  });
  /* TT&C antenna on the anti-nadir end */
  add(new THREE.CylinderGeometry(.04*s,.05*s,.4*s,8),dark,0,0,-.75*s,Math.PI/2);
  add(new THREE.SphereGeometry(.1*s,10,8),silver,0,0,-.98*s);
  return g;
}

/* Signal beam drawn as thin cylinders (WebGL lines are always 1 px wide, which disappears at campus scale). */
function beam(a,b,c,op,dash,r){
  const grp=new THREE.Group(),dir=b.clone().sub(a),len=dir.length(),n=dir.clone().normalize();
  if(!(len>0))return grp;
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),n);
  const seg=(t0,t1)=>{const l=t1-t0;if(l<=0)return;const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,l,6,1),bas(c,{transparent:op<1,opacity:op}));
    m.position.copy(a).addScaledVector(n,(t0+t1)/2);m.quaternion.copy(q);grp.add(m)};
  if(!dash)seg(0,len);else{const d=Q.dash[0],gp=Q.dash[1];for(let t=0;t<len;t+=d+gp)seg(t,Math.min(t+d,len))}
  return grp}

/* Classroom blackboard: dark-green slate with chalk lettering, wooden frame and chalk tray.
   The board faces +Z (into the room); the text is read from inside the room. */
const BOARD_LINES=['AAE4203 Group12','Present: 5G/6G vs GNSS Positioning'];
function blackboard(w,h,z,y){
  const grp=new THREE.Group(),PX=300,cw=Math.round(w*PX),ch=Math.round(h*PX),cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const g=cv.getContext('2d');
  const bg=g.createLinearGradient(0,0,cw,ch);bg.addColorStop(0,'#1f3329');bg.addColorStop(.55,'#27403a');bg.addColorStop(1,'#1d3027');g.fillStyle=bg;g.fillRect(0,0,cw,ch);
  /* faint eraser smudges */
  g.fillStyle='rgba(255,255,255,.035)';[[.15,.3,.22,.12],[.62,.62,.3,.14],[.8,.2,.15,.1]].forEach(a=>{g.beginPath();g.ellipse(a[0]*cw,a[1]*ch,a[2]*cw,a[3]*ch,-.15,0,7);g.fill()});
  const fam='"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS","Noto Sans TC",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#f4f1e6';g.shadowColor='rgba(255,255,255,.35)';g.shadowBlur=3;
  /* first line large, second line as large as fits the width */
  const fit=(t,px,maxW)=>{let f=px;do{g.font='bold '+f+'px '+fam;f-=2}while(g.measureText(t).width>maxW&&f>20);return f+2};
  const maxW=cw*.9,f1=fit(BOARD_LINES[0],Math.round(ch*.36),maxW),f2=fit(BOARD_LINES[1],Math.round(ch*.28),maxW);
  g.font='bold '+f1+'px '+fam;g.fillText(BOARD_LINES[0],cw/2,ch*.31);
  g.font='bold '+f2+'px '+fam;g.fillText(BOARD_LINES[1],cw/2,ch*.72);
  g.shadowBlur=0;g.strokeStyle='rgba(244,241,230,.75)';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(cw*.3,ch*.49);g.lineTo(cw*.7,ch*.485);g.stroke();
  const tx=new THREE.CanvasTexture(cv);tx.minFilter=THREE.LinearFilter;tx.generateMipmaps=false;
  const face=new THREE.Mesh(new THREE.PlaneGeometry(w,h),bas(0xffffff,{map:tx}));face.position.set(0,y,z+.035);grp.add(face);
  const wood=lam(0x8a6a45);
  const frame=new THREE.Mesh(new THREE.BoxGeometry(w+.16,h+.16,.05),wood);frame.position.set(0,y,z+.005);grp.add(frame);
  const tray=new THREE.Mesh(new THREE.BoxGeometry(w,.04,.1),wood);tray.position.set(0,y-h/2-.06,z+.08);grp.add(tray);
  grp.name='CD302 blackboard';return grp}

/* ---------- static scene ---------- */
function buildStatic(){clr(stat);blds=[];wm=null;staticRev++;const o=sc=='out';Q=o?QO:QI;const gc=cssc('gnd'),ik=cssc('ink'),cc=cssc('c');
if(o){
/* The outdoor scene is built from the exported GeoJSON data; the gNBs still use the simulation coordinates */
SC.out.g.forEach((q,k)=>{const pole=new THREE.Mesh(new THREE.CylinderGeometry(.9,1.2,16,10),lam(0x8896a3));pole.position.set(q[0],8,-q[1]);stat.add(pole);
const bx=new THREE.Mesh(new THREE.BoxGeometry(4,3,4),bas(cc));bx.position.set(q[0],17.5,-q[1]);stat.add(bx);
const l=lab('gNB '+(k+1),11);l.position.set(q[0],29,-q[1]);stat.add(l)});
const nl=lab(tx('lbN'),9);nl.position.set(0,8,-176);stat.add(nl);
const wl=lab(tx('lbW'),6);wl.position.set(0,5,60);stat.add(wl);
}else{
/* Room CD302: 60 tablet chairs, front blackboard and whiteboards, ceiling lights and 4 gNBs */
const R=ROOM;
const g=new THREE.Mesh(new THREE.PlaneGeometry(80,80),bas(gc.clone().multiplyScalar(.85)));g.rotation.x=-Math.PI/2;stat.add(g);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(R.w,R.d),bas(gc.clone().lerp(new THREE.Color(0xffffff),.3)));fl.rotation.x=-Math.PI/2;fl.position.y=.02;stat.add(fl);
wm=new THREE.MeshLambertMaterial({color:0xb9c6d0,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false});
[[0,-R.d/2,0,R.w],[0,R.d/2,0,R.w],[-R.w/2,0,Math.PI/2,R.d],[R.w/2,0,Math.PI/2,R.d]].forEach(a=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(a[3],R.h),wm);m.position.set(a[0],R.h/2,a[1]);m.rotation.y=a[2];stat.add(m)});
const rf=new THREE.Mesh(new THREE.PlaneGeometry(R.w,R.d),wm);rf.rotation.x=-Math.PI/2;rf.position.y=R.h;stat.add(rf);
const fr=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(R.w,R.h,R.d)),new THREE.LineBasicMaterial({color:ik,transparent:true,opacity:.7}));fr.position.y=R.h/2;stat.add(fr);
/* Front (north wall): centre blackboard (group and topic) + side whiteboards; lectern; projector */
const fz=-R.d/2+.04;
[-4.6,4.6].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.2,.04),bas(0xffffff));p.position.set(x,1.6,fz);stat.add(p)});

[-2.4,-1.3,-.2,.9,2,3.1].forEach(z=>{for(let i=0;i<10;i++){const x=-4.95+i*1.1,s=new THREE.Mesh(sg,cm);s.position.set(x,.45,z);const b=new THREE.Mesh(bk,cm);b.position.set(x,.7,z+.2);const a=new THREE.Mesh(am,amm);a.position.set(x+.2,.72,z-.12);stat.add(s,b,a)}});

function buildOutdoorFallback(){
  /* Keep Outdoor usable even when the supplied 3DM contains only Brep/NURBS. */
  const fallback=new THREE.Group();fallback.name='Outdoor fallback campus scene';
  const mat=(c)=>new THREE.MeshLambertMaterial({color:c});
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(340,340),mat(0x9eae9b));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;fallback.add(ground);
  const road=new THREE.Mesh(new THREE.PlaneGeometry(20,320),mat(0x555b61));road.rotation.x=-Math.PI/2;road.position.y=.015;fallback.add(road);
  const walkMat=mat(0xc4bcae),grassMat=mat(0x82977b),brick=mat(0xb8795d),stone=mat(0xc8bda9),roof=mat(0x55545a),glass=mat(0x526d7d);
  [-1,1].forEach(side=>{
    const walk=new THREE.Mesh(new THREE.PlaneGeometry(7,320),walkMat);walk.rotation.x=-Math.PI/2;walk.position.set(side*13.5,.025,0);fallback.add(walk);
    const green=new THREE.Mesh(new THREE.PlaneGeometry(42,320),grassMat);green.rotation.x=-Math.PI/2;green.position.set(side*38,.0,0);fallback.add(green);
    for(let j=0;j<7;j++){
      const z=-132+j*44,w=25+(j%3)*5,d=30,h=22+(j%4)*8,x=side*(20+w/2+5);
      const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),j%2?stone:brick);body.position.set(x,h/2,z);fallback.add(body);
      const cap=new THREE.Mesh(new THREE.BoxGeometry(w+1,1.2,d+1),roof);cap.position.set(x,h+.6,z);fallback.add(cap);
      for(let fy=0;fy<Math.floor(h/5);fy++)for(let fx=0;fx<Math.max(2,Math.floor(w/5));fx++){
        const win=new THREE.Mesh(new THREE.BoxGeometry(2.2,2.3,.16),glass);win.position.set(x-w/2+3+fx*5,3.5+fy*5,z-d/2-.1);fallback.add(win);
      }
    }
    for(let j=0;j<15;j++){
      const z=-140+j*20,x=side*18;
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.65,4,7),mat(0x70523b));trunk.position.set(x,2,z);fallback.add(trunk);
      const crown=new THREE.Mesh(new THREE.SphereGeometry(2.8,8,6),mat(0x47744d));crown.position.set(x,5.3,z);fallback.add(crown);
    }
  });
  for(let z=-145;z<=145;z+=20){const dash=new THREE.Mesh(new THREE.PlaneGeometry(.35,9),mat(0xe6dfc7));dash.rotation.x=-Math.PI/2;dash.position.set(0,.04,z);fallback.add(dash)}
  stat.add(fallback);return fallback;
}

async function loadTopoModel(rev){
  if(sc!=='out')return;
  const status=$('scn');
  try{
    const get=async name=>{const e=document.getElementById('geo-'+name.replace('.geojson',''));if(!e)throw new Error(tx('errGeo')+name);return JSON.parse(e.textContent)};
    const [contours,buildings,trees,roads,railways,greens,waterways,frame]=await Promise.all([
      get('contours.geojson'),get('buildings.geojson'),get('trees.geojson'),get('roads.geojson'),
      get('railways.geojson'),get('green_areas.geojson'),get('waterways.geojson'),get('frame.geojson')
    ]);
    if(rev!==staticRev||sc!=='out')return;
    const ring=frame.features[0].geometry.coordinates;
    const xs=ring.map(p=>p[0]),ys=ring.map(p=>p[1]);
    const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
    const cx=(minX+maxX)/2,cy=(minY+maxY)/2,W=maxX-minX,D=maxY-minY;
    const root=new THREE.Group();root.name='GeoJSON outdoor campus';
    const elevPts=[];
    contours.features.forEach(f=>{
      const e=Number(f.properties&&f.properties.elevation);
      (f.geometry.coordinates||[]).forEach(p=>{if(Number.isFinite(e))elevPts.push([p[0],p[1],e-5])});
    });
    if(!elevPts.length)throw new Error(tx('errElev'));
    const terrainAt=(x,y)=>{
      let best=[];
      for(let i=0;i<elevPts.length;i++){
        const p=elevPts[i],dx=p[0]-x,dy=p[1]-y,d=dx*dx+dy*dy;
        if(best.length<6){best.push([d,p[2]]);if(best.length===6)best.sort((a,b)=>a[0]-b[0]);}
        else if(d<best[5][0]){best[5]=[d,p[2]];best.sort((a,b)=>a[0]-b[0]);}
      }
      if(best[0][0]<.04)return best[0][1];
      let num=0,den=0;best.forEach(([d,z])=>{const w=1/Math.max(d,1);num+=w*z;den+=w});return den?num/den:0;
    };
    /* Interpolate a lightweight terrain surface from LiDAR contour elevations. */
    const nx=48,nz=44,verts=[],indices=[];
    for(let iz=0;iz<=nz;iz++)for(let ix=0;ix<=nx;ix++){
      const x=minX+W*ix/nx,y=minY+D*iz/nz;
      verts.push(x-cx,terrainAt(x,y),-(y-cy));
    }
    for(let iz=0;iz<nz;iz++)for(let ix=0;ix<nx;ix++){
      const a=iz*(nx+1)+ix,b=a+1,c=a+(nx+1),d=c+1;
      indices.push(a,b,c,b,d,c);
    }
    const tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));tg.setIndex(indices);tg.computeVertexNormals();
    const terrain=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({color:0x9eae91,side:THREE.DoubleSide}));terrain.name='LiDAR interpolated terrain';root.add(terrain);
    const base=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:0xb5b39b,side:THREE.DoubleSide}));
    base.rotation.x=-Math.PI/2;base.position.set(0,-.35,0);root.add(base);
    /* LiDAR contour polylines remain visible over the interpolated terrain. */
    const contourMat=new THREE.LineBasicMaterial({color:0x776f54,transparent:true,opacity:.62});
    contours.features.forEach(f=>{
      const e=Number(f.properties&&f.properties.elevation)-5;
      const pts=f.geometry.coordinates.map(p=>new THREE.Vector3(p[0]-cx,e+.18,-(p[1]-cy)));
      if(pts.length>1)root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),contourMat));
    });
    const adjustableBuildings=[];
    const addPolygons=(fc,material,extrude=false)=>{
      (fc.features||[]).forEach(f=>{
        const geom=f.geometry;if(!geom)return;
        const polys=geom.type==='Polygon'?[geom.coordinates]:geom.type==='MultiPolygon'?geom.coordinates:[];
        const featureMeshes=[];
        polys.forEach(poly=>{
          if(!poly[0]||poly[0].length<4)return;
          const makePath=(coords,PathClass)=>{
            const path=new PathClass();coords.forEach((p,i)=>{const x=p[0]-cx,y=p[1]-cy;if(i===0)path.moveTo(x,y);else path.lineTo(x,y)});return path;
          };
          const shape=makePath(poly[0],THREE.Shape);
          for(let h=1;h<poly.length;h++)if(poly[h].length>3)shape.holes.push(makePath(poly[h],THREE.Path));
          let g;
          if(extrude){const h=Math.max(2,Number(f.properties&&f.properties.height)||8);g=new THREE.ExtrudeGeometry(shape,{depth:h,bevelEnabled:false,curveSegments:1});}
          else g=new THREE.ShapeGeometry(shape);
          g.rotateX(-Math.PI/2);
          const mesh=new THREE.Mesh(g,material);
          if(extrude){const p=poly[0][0];mesh.position.y=terrainAt(p[0],p[1])+Number(f.properties&&f.properties.min_height||0);}
          else {const p=poly[0][0];mesh.position.y=terrainAt(p[0],p[1])+.12;}
          root.add(mesh);
          if(extrude)featureMeshes.push({mesh,baseHeight:Math.max(2,Number(f.properties&&f.properties.height)||8),baseY:mesh.position.y});
        });
        if(extrude&&featureMeshes.length){
          /* Keep each GeoJSON polygon footprint separate. A MultiPolygon can
             contain distant building parts; never make one box from its
             combined bounds, which creates giant bridge/T-shaped solids. */
          polys.forEach(poly=>{
            if(!poly[0]||poly[0].length<4)return;
            const ring=poly[0];
            const px=ring.map(p=>p[0]),py=ring.map(p=>p[1]);
            const minBX=Math.min(...px),maxBX=Math.max(...px),minBY=Math.min(...py),maxBY=Math.max(...py);
            const fx=(minBX+maxBX)/2,fy=(minBY+maxBY)/2;
            const score=(fx-cx)*(fx-cx)+(fy-cy)*(fy-cy);
            adjustableBuildings.push({
              score, sourceMeshes:featureMeshes,
              bounds:{minBX,maxBX,minBY,maxBY,fx,fy},
              baseHeight:Math.max(2,Number(f.properties&&f.properties.height)||8),
              groundY:terrainAt(fx,fy)
            });
          });
        }
      });
    };
    addPolygons(greens,new THREE.MeshLambertMaterial({color:0x78966e,side:THREE.DoubleSide}));
    addPolygons(waterways,new THREE.MeshLambertMaterial({color:0x6d9fb4,side:THREE.DoubleSide}));
    addPolygons(buildings,new THREE.MeshLambertMaterial({color:0xb9b5ad,side:THREE.DoubleSide}),true);
    /* Replace four individual surrounding footprints with four independent,
       neutral-grey solid rectangular prisms. Remove the original geometry. */
    adjustableBuildings.sort((a,b)=>a.score-b.score);
    const selectedBuildings=adjustableBuildings.slice(0,4);
    const removed=new Set();
    selectedBuildings.forEach(({sourceMeshes})=>sourceMeshes.forEach(({mesh})=>{
      if(removed.has(mesh))return;
      removed.add(mesh);
      if(mesh.parent)mesh.parent.remove(mesh);
      if(mesh.geometry)mesh.geometry.dispose();
    }));
    const solidMat=new THREE.MeshLambertMaterial({color:0xb9b5ad,side:THREE.DoubleSide});
    blds=selectedBuildings.map(({bounds,baseHeight,groundY})=>{
      const width=Math.max(3,bounds.maxBX-bounds.minBX);
      const depth=Math.max(3,bounds.maxBY-bounds.minBY);
      const box=new THREE.Mesh(new THREE.BoxGeometry(width,baseHeight,depth),solidMat);
      box.position.set(bounds.fx-cx,groundY+baseHeight/2,-(bounds.fy-cy));
      box.name='One surrounding solid rectangular building';
      root.add(box);
      return {meshes:[{mesh:box,baseHeight,groundY}]};
    });
    /* Transport lines. Width is retained as a visible tube diameter where supplied. */
    const addLines=(fc,color,defaultRadius)=>{
      const mat=new THREE.LineBasicMaterial({color});
      (fc.features||[]).forEach(f=>{
        const c=f.geometry&&f.geometry.coordinates;if(!c||c.length<2)return;
        const pts=c.map(p=>new THREE.Vector3(p[0]-cx,terrainAt(p[0],p[1])+.24,-(p[1]-cy)));
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
      });
    };
    addLines(roads,0x555b60,.8);addLines(railways,0x34383c,.5);
    /* Trees are placed from the tree point layer with their supplied height/crown data. */
    const trunkMat=new THREE.MeshLambertMaterial({color:0x76543a}),crownMat=new THREE.MeshLambertMaterial({color:0x47744d});
    trees.features.forEach(f=>{
      const p=f.geometry.coordinates,pr=f.properties||{},h=Math.max(2,Number(pr.height)||5),diam=Math.max(1,Number(pr.crown_diameter)||3);
      const x=p[0]-cx,z=-(p[1]-cy),ground=terrainAt(p[0],p[1]);
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,h*.42,6),trunkMat);trunk.position.set(x,ground+h*.21,z);root.add(trunk);
      const crown=new THREE.Mesh(new THREE.SphereGeometry(diam*.34,7,6),crownMat);crown.position.set(x,ground+h*.68,z);crown.scale.y=1.25;root.add(crown);
    });
    if(rev!==staticRev||sc!=='out')return;
    root.name='Topoexport GeoJSON terrain and campus';
    stat.add(root);
    /* Fit the real exported area in view; the legacy outdoor camera was sized for a 300 m mock scene. */
    V.t.set(0, 10, 0);
    V.r = cl(Math.max(W, D) * 1.42, 420, 1050);
    V.ph = 0.92;
    setH();
    status.textContent=tx('stOk',{W:Math.round(W),D:Math.round(D),c:contours.features.length,b:buildings.features.length,t:trees.features.length});
    req();
  }catch(err){
    console.error('GeoJSON outdoor scene load failed:',err);
    if(rev===staticRev&&sc==='out'){buildOutdoorFallback();status.textContent=tx('stFail',{e:err.message});req();}
  }
}

function setWalls(){if(wm)wm.opacity=.08+.47*P().L/35}
function setH(){
  const H=Math.max(0,Number(P().H)||0);
  blds.forEach(({meshes})=>meshes.forEach(({mesh,baseHeight,groundY})=>{
    /* Rectangular BoxGeometry is upright on world Y. Keep its footprint fixed
       and keep the bottom on the terrain while changing only its height. */
    mesh.visible=H>0;
    mesh.scale.set(1,Math.max(H,.01)/Math.max(baseHeight,.01),1);
    mesh.position.y=groundY+H/2;
    mesh.updateMatrix();
  }));
}

/* ---------- dynamic scene: one trial with the current slider values ---------- */
function vis(){if(!gS)return;gS.visible=$('kS').checked;gC.visible=$('kC').checked;gG.visible=$('kG').checked;gE.visible=$('kE').checked}
function buildDyn(){clr(dyn);const o=sc=='out',p=P(),ik=cssc('ink'),ox=$('kF').checked?[+$('ux').value,+$('uy').value]:null;Q=o?QO:QI;const hh=Q.hh;
seed=1000+dn*7919;const t=trial(sc,p,ox),q=t.p,H0=V3(q[0],q[1],hh);curP=q;
const ok=x=>x&&isFinite(x[0])&&isFinite(x[1]),eg=solve(t.ms,0),ec=solve(t.mc,0),eh=solve(t.ms.concat(t.mc),p.R);
gS=new THREE.Group();gC=new THREE.Group();gG=new THREE.Group();gE=new THREE.Group();dyn.add(gS,gC,gG,gE);
/* UE */
const ue=new THREE.Group();ue.position.set(q[0],0,-q[1]);
const bd=new THREE.Mesh(new THREE.CylinderGeometry(Q.rc,Q.rc,hh,8),bas(ik));bd.position.y=hh/2;ue.add(bd);
const hd=new THREE.Mesh(new THREE.SphereGeometry(Q.rs,16,12),bas(ik));hd.position.y=hh;ue.add(hd);
const rg=new THREE.Mesh(new THREE.RingGeometry(Q.r1,Q.r2,32),bas(ik));rg.rotation.x=-Math.PI/2;rg.position.y=Q.minw/2+.02;ue.add(rg);
const ul=lab('UE',Q.lab);ul.position.y=hh+Q.labU;ue.add(ul);dyn.add(ue);
/* satellites: 0 = LOS, 1 = NLOS / biased, 2 = blocked */
t.sv.forEach(s=>{
const d=new THREE.Vector3(Math.cos(s.el)*Math.sin(s.az),Math.sin(s.el),-Math.cos(s.el)*Math.cos(s.az));
const pos=H0.clone().addScaledVector(d,Q.satR),c=cssc(s.st==0?'g':s.st==1?'n':'x');
const sat=satelliteModel(Q.sat,c,s.st);sat.position.copy(pos);
sat.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),H0.clone().sub(pos).normalize());
gS.add(sat);
/* Signal line from the satellite's nadir antenna to the UE: solid tube = LOS, dashed tube = reflected / biased,
   faint thin line = blocked. The line ends at the antenna face so it does not run through the model. */
const nadir=H0.clone().sub(pos).normalize(),from=pos.clone().addScaledVector(nadir,Q.sat*.85);
gS.add(s.st==2?line(H0,pos,c,.28,false):beam(H0,from,c,s.st==1?.85:.9,s.st==1,Q.beam));
});
/* cellular: UE-gNB link, single-station fix, range ring */
t.bs.forEach((b,k)=>{const c=cssc(b.los?'c':'n'),gp=V3(b.g[0],b.g[1],Q.gh),mr=t.mc[2*k],ma=t.mc[2*k+1];
gC.add(line(H0,gp,c,.9,!b.los));
const pt=V3(b.g[0]+mr.z*Math.cos(ma.z),b.g[1]+mr.z*Math.sin(ma.z),hh),pm=new THREE.Mesh(new THREE.SphereGeometry(Q.pt,10,8),bas(c));pm.position.copy(pt);gC.add(pm);
gC.add(line(gp,pt,c,.45,false));
const w=Math.max(3*mr.s,Q.minw),rr=new THREE.Mesh(new THREE.RingGeometry(Math.max(mr.z-w,0),mr.z+w,Q.seg),bas(c,{transparent:true,opacity:.55,side:THREE.DoubleSide,depthWrite:false}));rr.rotation.x=-Math.PI/2;rr.position.set(b.g[0],o?.4:.05,-b.g[1]);gG.add(rr)});
/* estimates */
[[eg,'g'],[ec,'c'],[eh,'h']].forEach(([x,n])=>{if(!ok(x))return;const c=cssc(n),pt=V3(x[0],x[1],hh),m=new THREE.Mesh(new THREE.OctahedronGeometry(Q.est),bas(c));m.position.copy(pt);gE.add(m);gE.add(line(H0,pt,c,1,false))});
/* parameter labels */
if(o&&p.H>0){const l=lab(tx('lbH')+p.H+' m',13);l.position.set(30,p.H+12,0);dyn.add(l)}
if(!o){const l=lab(tx('lbL')+p.L+' dB',.6);l.position.set(0,ROOM.h+1.2,ROOM.d/2);dyn.add(l)}
vis();
/* readout */
const n0=t.sv.filter(s=>s.st<2).length,nl=t.sv.filter(s=>s.st==0).length,nn=t.sv.filter(s=>s.st==1).length,nb=10-n0,nc=t.bs.filter(b=>b.los).length;
const er=x=>ok(x)?Math.hypot(x[0]-q[0],x[1]-q[1]):null,chip=n=>`<i style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--${n})"></i>`;
const row=(n,k,txt,e)=>`<tr><td>${chip(k)}${n}</td><td style="text-align:left">${txt}</td><td>${e==null?tx('unav'):e.toFixed(1)+' m'}</td></tr>`;
$('rd').innerHTML=row(tx('nG'),'g',tx(o?'usOut':'usIn',{n0,nl,nn,nb})+(n0<3?tx('few'):''),er(eg))
+row(tx('nC'),'c',tx('cel',{nc}),er(ec))
+row(tx('nH'),'h',tx('hyb',{n0,r:p.R}),er(eh));
$('uep').textContent=tx('uep',{x:q[0].toFixed(1),y:q[1].toFixed(1)});
req()}
